services:
  app:
    image: ghcr.io/example/nizamkitchen:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DEPLOYMENT_ENVIRONMENT: production
      APP_URL: https://nizamkitchen.example.com
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgresql://nizamkitchen:${POSTGRES_PASSWORD}@postgres:5432/nizamkitchen?schema=public
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_ENDPOINT: https://object-storage.example.com
      OBJECT_STORAGE_BUCKET: nizamkitchen-production
      OBJECT_STORAGE_REGION: us-east-1
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      EMAIL_FROM: noreply@nizamkitchen.example.com
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    image: ghcr.io/example/nizamkitchen:latest
    restart: "no"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_URL: https://nizamkitchen.example.com
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: postgresql://nizamkitchen:${POSTGRES_PASSWORD}@postgres:5432/nizamkitchen?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nizamkitchen
      POSTGRES_USER: nizamkitchen
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nizamkitchen -d nizamkitchen"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
